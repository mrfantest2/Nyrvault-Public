name: Public Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-android-preflight.yml"
      - "game/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require sanitized build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f game/project.godot || { echo "::error::Sanitized Godot project missing. No APK can be built."; exit 1; }
          test -f game/export_presets.cfg || { echo "::error::Android export preset missing."; exit 1; }
          echo "Build inputs present; Android toolchain setup remains pending."
